- name: Build APK
  run: |
    export BUILDOZER_WARN_ON_ROOT=0

    # 🔥 fix NDK conflict
    export ANDROID_NDK_HOME=""
    export ANDROID_NDK=""
    export ANDROID_NDK_ROOT=""

    # ✅ CREATE spec manually (no init issues)
    cat > buildozer.spec << EOF
    [app]
    title = Kids Learn
    package.name = kidslearn
    package.domain = org.kidslearn
    source.dir = .
    source.include_exts = py
    version = 1.0
    requirements = python3,kivy
    orientation = portrait

    android.api = 31
    android.minapi = 21
    android.ndk = 25b
    android.archs = arm64-v8a
    android.accept_sdk_license = True

    [buildozer]
    log_level = 2
    warn_on_root = 0
    EOF

    buildozer android debug
