name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git python3-dev \
          libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev \
          unzip zip

        pip install --user buildozer cython
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0

        # 🔥 FIX: remove wrong NDK from GitHub runner
        export ANDROID_NDK_HOME=""
        export ANDROID_NDK=""
        export ANDROID_NDK_ROOT=""

        buildozer init || true

        sed -i 's/title = .*/title = Kids Learn/' buildozer.spec
        sed -i 's/package.name = .*/package.name = kidslearn/' buildozer.spec
        sed -i 's/package.domain = .*/package.domain = org.kidslearn/' buildozer.spec
        sed -i 's/requirements = .*/requirements = python3,kivy/' buildozer.spec

        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kids-learn-apk
        path: bin/*.apk
